name: DevBrief Daily
on:
  schedule:
    - cron: '17 21 * * *'   # UTC 21:17 = KST 06:17 (정각 혼잡 회피)
  workflow_dispatch:

jobs:
  briefing:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # keepalive 빈 커밋 push용
    steps:
      - uses: actions/checkout@v4

      # GitHub은 60일간 리포 활동이 없으면 schedule 워크플로를 자동 비활성화한다.
      # (2026-08-11에 실제로 꺼져서 일주일치 브리핑이 누락됨)
      # 마지막 커밋이 30일 넘었으면 빈 커밋을 밀어 타이머를 리셋한다.
      - name: Keepalive
        continue-on-error: true
        run: |
          AGE=$(( ($(date +%s) - $(git log -1 --format=%ct)) / 86400 ))
          echo "마지막 커밋: ${AGE}일 전"
          if [ "$AGE" -ge 30 ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keepalive (schedule 워크플로 유지)"
            git push
            echo "keepalive 커밋 push 완료"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
        working-directory: devbrief
      - run: python main.py
        working-directory: devbrief
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
